const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const CH = {};                                   // chart id -> geometry + series, for the hover crosshair

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

const arr = x => Array.isArray(x) ? x : [];

const obj = x => x && typeof x === "object" && !Array.isArray(x) ? x : {};

const val = x => x == null || x === "" || typeof x === "boolean" || isNaN(x) ? null : Number(x);

const num = (x, d = 0) => (x = val(x)) == null ? "–" : (x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -d) ? "−" : "") + Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});

const sgn = (x, d = 0) => (x = val(x)) == null ? "–" : (x > 0 && x >= 0.5 * Math.pow(10, -d) ? "+" : "") + num(x, d);

const cls = x => (x = val(x)) == null ? "" : x > 0 ? "good" : x < 0 ? "bad" : "";

const c2 = x => val(x) == null ? "–" : sgn(x * 100, 1) + "¢";

const px = x => val(x) == null ? "–" : Number(x).toFixed(3);

const pct = (x, d = 1) => val(x) == null ? "–" : num(x * 100, d) + "%";

const ago = t => val(t) == null ? "–" : (s => s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h")(Math.max(0, Math.round(NOW() / 1000 - t)));

const na = t => `<div class="na">${esc(t)}</div>`;

const info = t => `<span class="info" title="${esc(t)}">?</span>`;

const dday = s => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(s || "")); return m ? MON[+m[2] - 1] + " " + (+m[3]) : String(s || "–"); };

let fmtT = null, fmtD = null;

try { fmtT = new Intl.DateTimeFormat("en-US", {timeZone: "America/Los_Angeles", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
      fmtD = new Intl.DateTimeFormat("en-US", {timeZone: "America/Los_Angeles", month: "short", day: "numeric"}); } catch (e) { }

const hm = t => fmtT ? fmtT.format(new Date(t * 1000)) : new Date(t * 1000).toISOString().slice(11, 16);

const md = t => fmtD ? fmtD.format(new Date(t * 1000)) : new Date(t * 1000).toISOString().slice(5, 10);

function when(t) {                               // "2026-10-02 13:02:11" -> "13:02:11" today, "Oct 1 13:02" another day
  if (typeof t === "number") return md(t) + " " + hm(t);
  const s = String(t || ""), today = String(S.t || "").slice(0, 10);
  return s.length < 19 ? s || "–" : s.slice(0, 10) === today ? s.slice(11, 19) : dday(s) + " " + s.slice(11, 16);
}

function tzOff(t) {                              // minutes PT is ahead of UTC at t (−420 in PDT)
  if (!fmtT) return 0;
  const [h, m] = fmtT.format(new Date(t * 1000)).split(":").map(Number), d = new Date(t * 1000);
  let o = (h * 60 + m) - (d.getUTCHours() * 60 + d.getUTCMinutes());
  if (o > 720) o -= 1440; if (o < -720) o += 1440; return o;
}

const f1 = v => Math.round(v * 10) / 10;

function ticks(lo, hi, n) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v / step) * step);
  return {lo: a, hi: b, step, ticks: out};
}

const kf = (v, step) => v === 0 ? "0" : Math.abs(step) >= 1000 ? num(v / 1000, step % 1000 ? 1 : 0) + "k" : num(v, step < 1 ? 2 : 0);

function pad(lo, hi, f) { const s = (hi - lo) || Math.abs(hi) || 1; return [lo < 0 ? lo - s * f : lo, hi > 0 ? hi + s * f : hi]; }

function barPath(x, w, y0, y1, round) {           // a bar from the baseline y0 to y1, 4px rounded at the far end only
  const h = Math.abs(y1 - y0); if (h < 0.4) return "";
  const r = round ? Math.min(4, h, w / 2) : 0, up = y1 < y0, s = up ? 1 : -1;
  x = f1(x); w = f1(w); y0 = f1(y0); y1 = f1(y1);
  return `M${x},${y0}V${f1(y1 + s * r)}Q${x},${y1} ${f1(x + r)},${y1}H${f1(x + w - r)}Q${f1(x + w)},${y1} ${f1(x + w)},${f1(y1 + s * r)}V${y0}Z`;
}

function width(id) { const el = document.getElementById("b-" + id), w = el && el.clientWidth; return Math.max(300, Math.min(1600, w || 900)); }

function linePath(pts, X, Y) {                  // pts [[t, v]], a gap (null) starts a new segment
  let d = "", pen = false;
  for (const [t, v] of pts) { if (v == null) { pen = false; continue; } d += (pen ? "L" : "M") + f1(X(t)) + "," + f1(Y(v)); pen = true; }
  return d;
}

function nearest(ts, t) { let lo = 0, hi = ts.length - 1; if (hi < 0) return -1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] < t) lo = m; else hi = m; } return Math.abs(ts[lo] - t) <= Math.abs(ts[hi] - t) ? lo : hi; }

function timeTicks(t0, t1, w) {
  const span = Math.max(1, t1 - t0), steps = [1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800];
  const step = steps.find(s => span / s <= Math.max(2, w / 85)) || 604800, off = tzOff(t0) * 60, out = [];
  for (let t = Math.ceil((t0 + off) / step) * step - off; t <= t1; t += step) out.push(t);
  return {step, ticks: out, label: t => { const day = ((t + off) % 86400 + 86400) % 86400 === 0; return step >= 86400 || day ? md(t) : hm(t); }};
}

const tipAttr = html => ` data-tip="${esc(html)}"`;

const legend = items => `<div class="legend">${items.map(([mark, text]) => `<span>${mark}${text}</span>`).join("")}</div>`;

const sw = c => `<i class="sw" style="background:${c}"></i>`;

const V = k => obj(S[k]);

const k1 = x => (x = val(x)) == null ? "–" : Math.abs(x) >= 1000 ? num(x / 1000, 1) + "k" : num(x);

const sg1 = x => (x = val(x)) == null ? "–" : (x > 0 ? "+" : "") + k1(x);

const cents = x => (x = val(x)) == null ? "–" : (x > 0 ? "+" : "") + num(x, 1) + "¢";

const na5 = t => `<div class="na5">${esc(t || "no sample yet")}</div>`;

const tsAgo = t => val(t) == null ? "–" : ago(t);                 // t = epoch seconds

ui.v5 = Object.assign({basis: "board", pv: "market", oexp: false, hlx: null, mkq: "", mkf: "all", mkg: "", mkview: "table", mksort: {k: "gap", dir: -1}, mkcol: {},
  card: null, mk: null, mkd: null, actf: "all", acts: "", seen: {}, glowT: {}, hchk: null, confirm: null, advOpen: false}, ui.v5 || {});

function ov_days() {
  const o = V("v5ov"), days = arr(o.days).filter(d => d && d.board != null);
  if (!days.length) return na5(o.days_error ? String(o.days_error.error || o.days_error) : "no sample yet");
  const fair = ui.v5.basis === "fair", W = width("ovDays"), H = 230, L = 46, R = 8, T = 18, B = 26;
  const tot = d => fair ? d.fair : d.board, rl = d => d.realized, op = d => fair ? d.fair_open : d.open;
  let lo = 0, hi = 0;
  for (const d of days) { const parts = [rl(d), op(d)]; let p = 0, n = 0; for (const v of parts) { if (v > 0) p += v; else n += v; } hi = Math.max(hi, p, tot(d) || 0); lo = Math.min(lo, n, tot(d) || 0); }
  [lo, hi] = pad(lo, hi, 0.12);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B), bw = Math.max(8, Math.min(46, (W - L - R) / days.length * 0.62)), step = (W - L - R) / days.length;
  let s = `<svg width="${W}" height="${H}"><defs><pattern id="hatch5" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--panel)" opacity=".7"/></pattern></defs>`;
  for (const v of ticks(lo, hi, 4).ticks.filter(v => v >= lo && v <= hi)) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text x="${L - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">${kf(v, Math.abs(hi - lo) / 4)}</text>`;
  s += `<line class="zl" x1="${L}" x2="${W - R}" y1="${f1(Y(0))}" y2="${f1(Y(0))}"/>`;
  const lab5 = [], bars5 = [], every5 = Math.max(1, Math.ceil(46 / step));
  days.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2; let up = 0, dn = 0;
    for (const [v, c] of [[rl(d), "r"], [op(d), "o"]]) {
      if (v == null || v === 0) continue;
      const y0 = v > 0 ? Y(up) : Y(dn), y1 = v > 0 ? Y(up + v) : Y(dn + v);
      s += `<rect class="b5${c}${v < 0 ? "n" : ""}" x="${f1(x)}" y="${f1(Math.min(y0, y1))}" width="${f1(bw)}" height="${f1(Math.max(1, Math.abs(y1 - y0)))}"/>`;
      if (d.partial) s += `<rect x="${f1(x)}" y="${f1(Math.min(y0, y1))}" width="${f1(bw)}" height="${f1(Math.max(1, Math.abs(y1 - y0)))}" fill="url(#hatch5)"/>`;
      if (v > 0) up += v; else dn += v;
    }
    const t = tot(d), ty = t >= 0 ? Y(Math.max(up, t)) - 5 : Y(Math.min(dn, t)) + 13;
    bars5.push([x, Y(up), x + bw, Y(dn)]);
    if (t != null) lab5.push({i, x: x + bw / 2, y: ty, t, s: sg1(t)});
    if (i % every5 === 0 && x + bw / 2 + 18 <= W) s += `<text x="${f1(x + bw / 2)}" y="${H - 8}" text-anchor="middle">${esc(dday(d.day))}</text>`;
    s += `<rect x="${f1(L + i * step)}" y="${T}" width="${f1(step)}" height="${H - T - B}" fill="transparent"${tipAttr(`<b>${esc(dday(d.day))}${d.partial ? " (today, open)" : ""}</b><br>${fair ? "at fair" : "on the board"} <b>${sgn(t)}</b><br>realized ${sgn(d.realized)} · open positions ${sgn(op(d))}<br><span class="mute">start ${num(fair ? d.start_fair : d.start)} → end ${num(fair ? d.end_fair : d.end)}</span>`)}/>`;
  });
  const placed5 = [], hit5 = a => b => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  for (const l of lab5.sort((a, b) => Math.abs(b.t) - Math.abs(a.t))) {
    const w = String(l.s).length * 6.6 + 6, h = bw / 2 + 1;
    for (const [tx, an, x0] of [[l.x, "middle", l.x - w / 2], [l.x + h, "end", l.x + h - w], [l.x - h, "start", l.x - h]]) {
      const bx = [x0, l.y - 11, x0 + w, l.y + 3];
      if (x0 < 2 || x0 + w > W - 2 || placed5.some(hit5(bx)) || bars5.some((b, j) => j !== l.i && hit5(bx)(b))) continue;
      placed5.push(bx); s += `<text class="vl" x="${f1(tx)}" y="${f1(l.y)}" text-anchor="${an}">${l.s}</text>`; break;
    }
  }
  return s + `</svg>` + legend([[sw("var(--sigb)"), "realized"], [`<i class="sw" style="background:var(--sigb);opacity:.42"></i>`, "open positions"], ["", "SIG days run from 00:00 UTC; Nov 5 to 8 are settlement days"]]);
}

function ov_acct() {
  const o = V("v5ov"), pts = arr(o.account_series).filter(p => p && p[1] != null);
  if (pts.length < 2) return na5();
  const W = width("ovAcct"), H = 230, L = 54, R = 10, T = 12, B = 26, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Infinity, hi = -Infinity; for (const p of pts) for (const v of [p[1], p[2]]) if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  [lo, hi] = [lo - (hi - lo) * 0.06, hi + (hi - lo) * 0.06];
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo || 1) * (H - T - B);
  const id = "ovacct", series = [{name: "SIG marks", color: "var(--sigb)", t: pts.map(p => p[0]), v: pts.map(p => p[1]), Y, gap: 3600, fmt: v => num(v)},
    {name: "at fair", color: "var(--steel)", t: pts.map(p => p[0]), v: pts.map(p => p[2]), Y, gap: 3600, fmt: v => num(v)}];
  CH[id] = {id, t0, t1, L, R, W, X, series};
  let s = `<svg width="${W}" height="${H}">`;
  for (const v of ticks(lo, hi, 4).ticks.filter(v => v >= lo && v <= hi)) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text x="${L - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">${kf(v, (hi - lo) / 4)}</text>`;
  { const tt = timeTicks(t0, t1, W); for (const t of tt.ticks) s += `<text x="${f1(X(t))}" y="${H - 8}" text-anchor="middle">${esc(tt.label(t))}</text>`; }
  series.forEach((sr, i) => { s += `<path class="ln" stroke="${sr.color}" d="${linePath(pts.map(p => [p[0], p[i + 1]]), X, Y)}"/><circle id="xh-${id}-${i}" r="3.5" fill="${sr.color}" display="none"/>`; });
  s += `<line id="xh-${id}" class="xh" y1="${T}" y2="${H - B}" display="none"/><rect data-chart="${id}" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  return s + legend([[sw("var(--sigb)"), "SIG marks"], [sw("var(--steel)"), "at Polymarket fair"]]);
}

function ov_rankchart() {
  const r = obj(V("v5ov").rank), pts = arr(r.series); if (pts.length < 2) return na5();
  const W = width("ovRankC"), H = 230, L = 46, R = 46, T = 12, B = 26, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const lmin = Math.log10(10), lmax = Math.log10(Math.max(1500, ...pts.map(p => p[1])));
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (Math.log10(Math.max(1, v)) - lmin) / (lmax - lmin) * (H - T - B);
  let s = `<svg width="${W}" height="${H}">`;
  for (const v of [10, 25, 50, 100, 250, 500, 1000]) if (Math.log10(v) <= lmax) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text x="${L - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">#${v}</text>`;
  for (const v of [100, 50, 25]) s += `<line x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--steel)" stroke-dasharray="4 4"/><text x="${W - R + 4}" y="${f1(Y(v) + 4)}" class="lbl">top ${v}</text>`;
  { const tt = timeTicks(t0, t1, W); for (const t of tt.ticks) s += `<text x="${f1(X(t))}" y="${H - 8}" text-anchor="middle">${esc(tt.label(t))}</text>`; }
  const id = "ovrank", sr = {name: "our rank", color: "var(--sigb)", t: pts.map(p => p[0]), v: pts.map(p => p[1]), Y, gap: 7200, fmt: v => "#" + num(v)};
  CH[id] = {id, t0, t1, L, R, W, X, series: [sr]};
  s += `<path class="ln" stroke="var(--sigb)" d="${linePath(pts, X, Y)}"/><circle id="xh-${id}-0" r="3.5" fill="var(--sigb)" display="none"/>`;
  s += `<line id="xh-${id}" class="xh" y1="${T}" y2="${H - B}" display="none"/><rect data-chart="${id}" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  return s + `<div class="sub5">Overall rank, log scale, better is higher</div>`;
}

function mkRows() {
  let rows = arr(S.v5mk_rows);
  const q = (ui.v5.mkq || "").trim().toLowerCase();
  if (q) rows = rows.filter(r => [r.race, r.state, r.title, r.contract, r.party, r.group].some(x => String(x || "").toLowerCase().includes(q)));
  const f = ui.v5.mkf;
  if (f === "hold") rows = rows.filter(r => r.hold);
  if (f === "nohold") rows = rows.filter(r => !r.hold);
  if (f === "g3") rows = rows.filter(r => Math.abs(val(r.gap_c) || 0) >= 3);
  if (f === "g5") rows = rows.filter(r => Math.abs(val(r.gap_c) || 0) >= 5);
  if (f === "orders") rows = rows.filter(r => r.orders);
  if (f === "g3empty") rows = rows.filter(r => !r.hold && !r.orders && Math.abs(val(r.gap_c) || 0) >= 3);
  if (ui.v5.mkg) rows = rows.filter(r => r.group === ui.v5.mkg);
  return rows;
}

const MKC = [["race", "Race", 0], ["contract", "Contract", 0], ["sig_yes", "SIG Buy YES", 1], ["sig_no", "SIG Buy NO", 1], ["pm_yes", "PM Buy YES", 1], ["pm_no", "PM Buy NO", 1], ["gap", "Gap SIG−PM", 1], ["hold", "Held at the lock", 0]];

function mk_table() {
  const rows = mkRows(); if (!arr(S.v5mk_rows).length) return na5();
  if (ui.v5.mkview === "map") return mk_map(rows);
  const races = new Map(); for (const r of rows) { const k = r.group + "|" + r.race; if (!races.has(k)) races.set(k, []); races.get(k).push(r); }
  const srt = ui.v5.mksort, keyv = rs => { const r = rs.reduce((a, b) => Math.abs(val(b.gap_c) || 0) > Math.abs(val(a.gap_c) || 0) ? b : a, rs[0]);
    return srt.k === "gap" ? Math.abs(val(r.gap_c) || 0) : srt.k === "race" ? r.race : srt.k === "vol24" ? rs.reduce((a, b) => a + (b.vol24 || 0), 0) : srt.k === "orders" ? rs.reduce((a, b) => a + (b.orders || 0), 0) : srt.k === "hold" ? rs.reduce((a, b) => a + (b.hold ? b.hold.value : 0), 0) : val(r[srt.k]) || 0; };
  const groups = {};
  for (const [k, rs] of races) { const g = k.split("|")[0]; (groups[g] = groups[g] || []).push(rs); }
  let s = `<div class="wrap5 mk5"><table class="t5"><thead><tr>${MKC.map(([k, t, n]) => `<th class="${n ? "n" : ""}" data-mksort="${k}" style="cursor:pointer">${t}${srt.k === k ? (srt.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("")}</tr></thead><tbody>`;
  for (const g of ["Senate", "Governor", "House", "National"]) {
    const list = groups[g]; if (!list) continue;
    list.sort((a, b) => { const x = keyv(a), y = keyv(b); return (x > y ? 1 : x < y ? -1 : 0) * srt.dir; });
    const phoneShut = typeof window !== "undefined" && window.innerWidth < 640 && !(ui.v5.mkq || "").trim() && (!ui.v5.mkf || ui.v5.mkf === "all") && !ui.v5.mkg && ui.v5.mkcol[g] === undefined;   // phone: groups start collapsed (tap to open; a search or filter opens them)
    const shut = ui.v5.mkcol[g] || phoneShut;
    s += `<tr class="grp" data-mkcol="${g}"><td colspan="${MKC.length}">${shut ? "▸" : "▾"} ${g} (${list.length} races)</td></tr>`;
    if (shut) continue;
    for (const rs of list) {
      rs.sort((a, b) => String(a.contract).localeCompare(String(b.contract)));
      rs.forEach((r, i) => {
        const gap = val(r.gap_c), gi = gap == null ? 0 : Math.min(1, Math.abs(gap) / 15);
        s += `<tr class="cl" data-mk="${esc(r.ex)}">${i === 0 ? `<td class="race" rowspan="${rs.length}" data-l="">${esc(r.race)}</td>` : ""}<td class="ct" data-l="">${esc(r.contract)}</td>
          <td class="n" data-l="SIG YES"${tipAttr(`SIG bid ${px(r.sig_bid)} / ask ${px(r.sig_ask)}${r.depth ? "" : ""}`)}>${px(r.sig_yes)}</td><td class="n" data-l="SIG NO">${px(r.sig_no)}</td>
          <td class="n" data-l="PM YES"${tipAttr(`Polymarket bid ${px(r.pm_bid)} / ask ${px(r.pm_ask)} · fair ${px(r.fair)}`)}>${px(r.pm_yes)}</td><td class="n" data-l="PM NO">${px(r.pm_no)}</td>
          <td class="n" data-l="gap" style="background:${gap == null ? "transparent" : (gap > 0 ? "rgba(192,57,43," : "rgba(8,98,166,") + f1(0.08 + 0.4 * gi) + ")"}">${cents(gap)}</td>
          <td class="hold5" data-l="hold">${r.hold ? `<span class="pill5">${esc(r.hold.side.toUpperCase())} ${num(r.hold.shares)}</span> <span class="sub5">${k1(r.hold.value)}</span>` : "—"}</td></tr>`;
      });
    }
  }
  return s + `</tbody></table></div>`;
}

function mk_map(rows) {
  const by = {}; for (const r of rows) { const k = r.group + "|" + r.race; (by[k] = by[k] || []).push(r); }
  let s = "";
  for (const g of ["Senate", "Governor", "House", "National"]) {
    const races = Object.entries(by).filter(([k]) => k.startsWith(g + "|")).sort((a, b) => String(a[1][0].state + a[0]).localeCompare(String(b[1][0].state + b[0])));
    if (!races.length) continue;
    s += `<h3 style="margin:12px 0 6px;font-size:15px">${g}</h3><div class="tiles5">`;
    for (const [k, rs] of races) {

    }

  }

  const w = t.offsetWidth || 200, h = t.offsetHeight || 60, vw = window.innerWidth, vh = window.innerHeight;

  for (const C of Object.values(CH)) { const x = document.getElementById("xh-" + C.id); if (x) x.setAttribute("display", "none"); C.series.forEach((s, i) => { const d = document.getElementById(`xh-${C.id}-${i}`); if (d) d.setAttribute("display", "none"); }); }
}

function lineHover(el, e) {
  const C = CH[el.getAttribute("data-chart")], svg = el.ownerSVGElement; if (!C || !svg) return hideTip();
  const r = svg.getBoundingClientRect(), t = C.t0 + (e.clientX - r.left - C.L) / (C.W - C.L - C.R) * (C.t1 - C.t0), lines = [];
  C.series.forEach((s, i) => {
    const j = nearest(s.t, t), d = document.getElementById(`xh-${C.id}-${i}`);
    if (j < 0 || Math.abs(s.t[j] - t) > s.gap || s.v[j] == null) { if (d) d.setAttribute("display", "none"); return; }
    if (d) { d.setAttribute("cx", f1(C.X(s.t[j]))); d.setAttribute("cy", f1(s.Y(s.v[j]))); d.removeAttribute("display"); }
    lines.push(`<div>${sw(s.color)}${esc(s.name)} <b>${s.fmt(s.v[j])}</b></div>`);
  });
  const x = document.getElementById("xh-" + C.id), cx = f1(C.X(Math.max(C.t0, Math.min(C.t1, t))));
  if (x) { x.setAttribute("x1", cx); x.setAttribute("x2", cx); x.removeAttribute("display"); }
  showTip(`<div class="mute">${esc(md(t) + " " + hm(t))} PT</div>` + (lines.join("") || '<div class="mute">no sample here</div>'), e);
}

  return `<div class="sub5" style="margin-bottom:8px">Prices as of ${esc(m.as_of_txt || "–")}: trading had closed at 09:00 and SIG had not settled anything yet.</div>
    <div style="margin-bottom:10px">${num(sm.contracts)} contracts · I held ${num(sm.held)} at the lock</div>
    <div class="fil5"><input id="mkq" placeholder="search state, race, district (press /)" value="${esc(ui.v5.mkq)}" style="min-width:240px">
    ${[["all", "All"], ["hold", "Held"], ["nohold", "Not held"], ["g3", "Gap ≥ 3¢"], ["g5", "Gap ≥ 5¢"]].map(([k, t]) => `<button data-mkf="${k}" class="${ui.v5.mkf === k ? "on" : ""}">${t}</button>`).join("")}
    <select id="mkg"><option value="">every race type</option>${["Senate", "Governor", "House", "National"].map(g => `<option ${ui.v5.mkg === g ? "selected" : ""}>${g}</option>`).join("")}</select>
    <div class="seg5"><button data-mkview="table" class="${ui.v5.mkview === "table" ? "on" : ""}">Table</button><button data-mkview="map" class="${ui.v5.mkview === "map" ? "on" : ""}">Map</button></div></div>`;
}
function openMk(ex) { ui.v5.mk = ui.v5.mk === ex ? null : ex; draw(); }
function mk_panel() {
  const ex = ui.v5.mk; if (!ex) return "";
  const r = arr(S.v5mk_rows).find(x => x.ex === ex); if (!r) return "";
  const h = r.hold, stt = {settled: "settled on SIG", called: "called, still settling on SIG", open: "not called yet: counted at its Polymarket price"};
  return `<div class="side5"><button class="btn5 x" data-closemk="1">✕</button><h3 style="font-size:17px;margin:0 0 4px">${esc(r.title)}</h3><div class="sub5">${esc(r.race)} · ${esc(r.contract)}</div>
    <h3 style="margin-top:14px">SIG, after the close</h3><div>bid <b>${px(r.sig_bid)}</b> · ask <b>${px(r.sig_ask)}</b></div>
    <h3 style="margin-top:14px">Polymarket</h3><div>bid <b>${px(r.pm_bid)}</b> · ask <b>${px(r.pm_ask)}</b> · fair <b>${px(r.fair)}</b></div>
    <h3 style="margin-top:14px">My position at the lock</h3>${h ? `<div><b>${esc(String(h.side).toUpperCase())} ${num(h.shares)}</b> · ${num(h.value)} at SIG marks</div>
      ${h.result == null ? "" : `<div>pays <b>${px(h.result)}</b> a share · final value <b>${num(h.value_final)}</b></div><div class="sub5">${esc(stt[h.status] || "")}</div>`}` : na5("none")}</div>`;
}
function lead_frozen() {
  const L = V("leaders_frozen"), F = F0(), lines = arr(L.lines).filter(l => l && val(l.pnl) != null);
  if (F.rank == null && !lines.length) return na5("The leaderboard figures are not in this export.");
  const fig = (lab, big, sub, c) => `<div class="fig"><div class="lab5">${lab}</div><div class="big5 ${c || ""}">${big}</div><div class="sub5">${sub}</div></div>`;
  const above = lines.filter(l => l.n < F.rank).pop(), below = lines.find(l => l.n > F.rank);
  const band = `<div class="band5 g3">${fig("My rank", "#" + num(F.rank), `of ${num(F.total)} traders · top ${num(100 * F.rank / F.total, 1)}%`)}
    ${fig("My P&L on the board", sgn(F.board_pnl), `at SIG marks${F.open_n ? ` · ${sgn(F.pnl)} as if every market settled` : ""}`, cls(F.board_pnl))}
    ${fig("The lines around me", above ? "#" + above.n : "–", above ? `${num(above.pnl - F.board_pnl)} above me${below ? ` · #${below.n} is ${num(F.board_pnl - below.pnl)} below` : ""}` : "")}</div>`;
  const rows = lines.map(l => ({n: l.n, pnl: l.pnl})).concat([{n: F.rank, pnl: F.board_pnl, me: true}]).sort((a, b) => a.n - b.n || (a.me ? 1 : -1));
  const t = rows.map(r => r.me ? `<tr style="font-weight:700;background:var(--chip)"><td class="n">#${num(r.n)}</td><td>me</td><td class="n ${cls(r.pnl)}">${sgn(r.pnl)}</td><td class="n">—</td></tr>`
    : `<tr><td class="n">#${num(r.n)}</td><td class="sub5">#${r.n} line</td><td class="n">${sgn(r.pnl)}</td><td class="n">${r.pnl >= F.board_pnl ? num(r.pnl - F.board_pnl) + " above" : num(F.board_pnl - r.pnl) + " below"}</td></tr>`).join("");
  return band + `<div class="p5" style="margin-top:12px"><div class="h5"><h3>Leaderboard lines</h3></div><div class="wrap5"><table class="t5"><thead><tr><th class="n">Rank</th><th></th><th class="n">P&L</th><th class="n">vs me</th></tr></thead><tbody>${t}</tbody></table></div>
    <div class="sub5" style="margin-top:8px">SIG's leaderboard, ${asof(F.board_t)}. Other players' names, trade counts and IDs are left out of this export.</div></div>`;
}

document.addEventListener("click", e => {
  const t = e.target; if (!t || !t.closest) return;
  if (t.closest("[data-nexp]")) { ui.nexp = !ui.nexp; draw(); return; }
  if (v5click(e)) return;
  const tp = t.closest("[data-tip]"); if (tp) showTip(tp.getAttribute("data-tip"), e);      // touch screens: tap for the tooltip
  const b = t.closest("button"); if (!b) return;
  if (b.dataset.tab) { ui.tab = b.dataset.tab; ui.v5.mk = null; draw(); window.scrollTo(0, 0); return; }
  if (b.id === "themeBtn") { setTheme({auto: "light", light: "dark", dark: "auto"}[ui.theme] || "auto"); draw(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.v5.mk) { ui.v5.mk = null; draw(); } });
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(draw, 150); });

function draw() {
  setHTML("tabs", Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === ui.tab ? "on" : ""}">${v}</button>`).join(""));
  setHTML("themeBtn", {auto: "Theme: auto", light: "Theme: light", dark: "Theme: dark"}[ui.theme] || "Theme");
  if (!SKEL[ui.tab]) ui.tab = "overview";
  if (ui.shown !== ui.tab) { document.getElementById("main").innerHTML = `<div class="what5">${esc(WHAT[ui.tab])}</div>` + SKEL[ui.tab](); ui.shown = ui.tab; ui.cache = {}; }
  for (const [id, fn] of Object.entries(BLOCKS[ui.tab])) put(id, block(id, fn));
  setHTML("side5", ui.tab === "markets" ? block("mkp", mk_panel) : "");
}
draw();

</script></body></html>
